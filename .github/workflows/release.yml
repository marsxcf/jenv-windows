name: release

# Builds the module, runs analysis + tests, publishes it to PowerShell Gallery
# (Install-Module JEnv), and publishes a GitHub Release with the Inno Setup
# convenience installer + module zip.
#
# PSGallery publish is gated on the PSGALLERY_API_KEY secret and skips if the
# version is already published (PSGallery versions are immutable). winget is
# not a target: winget-pkgs rejected this package under the noScripts policy
# because it is a PowerShell module with no compiled binary.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without leading v)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v?(.+)$') {
            $version = $Matches[1]
          } else {
            $version = '${{ github.event.inputs.version }}'
          }
          if (-not $version) { throw "Could not determine version." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build (analyze + test + assemble + zip)
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $path = "artifacts/JEnv/$ver"
          if (-not (Test-Path -LiteralPath $path)) { throw "Staged module not found at '$path'." }
          if (-not $env:PSGALLERY_API_KEY) {
            Write-Warning 'PSGALLERY_API_KEY not set; skipping PSGallery publish.'
            return
          }
          # PSGallery versions are immutable; skip instead of failing on re-runs.
          $existing = Find-Module -Name JEnv -Repository PSGallery -RequiredVersion $ver -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "JEnv $ver already on PowerShell Gallery; skipping."
            return
          }
          Write-Host "Publishing JEnv $ver to PowerShell Gallery..."
          Publish-Module -Path $path -NuGetApiKey $env:PSGALLERY_API_KEY -Repository PSGallery
          Write-Host "Published JEnv $ver to PowerShell Gallery."

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          # ISCC.exe can land in different places: the x64 installer targets
          # Program Files, but the runner image may already ship Inno Setup under
          # Program Files (x86), and winget reports "Successfully installed" even
          # when it skipped the install as already-present. Locate the compiler
          # dynamically instead of hard-coding one path.
          function Find-InnoSetupCompiler {
            $roots = @(
              $env:ProgramFiles,
              ${env:ProgramFiles(x86)},
              (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages')
            ) | Where-Object { $_ }
            foreach ($root in $roots) {
              $candidate = Join-Path $root 'Inno Setup 7\ISCC.exe'
              if (Test-Path -LiteralPath $candidate) { return $candidate }
            }
            foreach ($root in $roots) {
              $hit = Get-ChildItem -LiteralPath $root -Filter 'ISCC.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue |
                     Where-Object { $_.DirectoryName -match 'Inno Setup 7' } |
                     Select-Object -ExpandProperty FullName -First 1
              if ($hit) { return $hit }
            }
            return $null
          }

          $iscc = Find-InnoSetupCompiler
          if (-not $iscc) {
            Write-Host 'Inno Setup 7 not found; installing via winget...'
            winget install --id JRSoftware.InnoSetup.7 --exact --source winget `
              --silent --accept-package-agreements --accept-source-agreements `
              --disable-interactivity
            $iscc = Find-InnoSetupCompiler
          }
          if (-not $iscc) {
            throw 'Inno Setup 7 compiler (ISCC.exe) was not found under Program Files after install.'
          }
          $compilerBanner = (& $iscc /? 2>&1 | Select-Object -First 1)
          if ($compilerBanner -notmatch '^Inno Setup 7 ') {
            throw "Expected Inno Setup 7, found '$compilerBanner'."
          }
          Write-Host "Found: $iscc"
          Write-Host $compilerBanner
          "INNO_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build 64-bit installer
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          & $env:INNO_ISCC "/DAppVersion=$ver" packaging\installer.iss
          if (-not (Test-Path "packaging\Output\jenv-windows-$ver-setup.exe")) {
            throw "Installer was not produced."
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: jenv-windows ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            packaging/Output/jenv-windows-${{ steps.ver.outputs.version }}-setup.exe
            artifacts/JEnv.${{ steps.ver.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
